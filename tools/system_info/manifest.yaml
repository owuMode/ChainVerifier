# tools/system_info/manifest.yaml
#
# system_info — report facts about the current machine.
#
# Pure Python. Read-only. No side effects.

tool_id: system_info
name: System Info
description: >
  Reports basic facts about the current machine: operating system,
  version, architecture, Python version, and host name. Safe,
  read-only, no side effects.

category: system
version: "1.0.0"

permission_level: SAFE

capabilities:
  - safe
  - side_effect_free
  - read_only

denied: false

input_schema_file: schema.json