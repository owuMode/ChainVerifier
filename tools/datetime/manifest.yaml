# tools/datetime/manifest.yaml
#
# datetime — return the current date and time.
#
# Pure Python. No filesystem, no network, no OS mutation.
# Deterministic shape, time-dependent content.

tool_id: datetime
name: Date & Time
description: >
  Returns the current date, time, timezone, and day of week in the
  system's local timezone, plus the equivalent UTC time.

category: system
version: "1.0.0"

permission_level: SAFE

capabilities:
  - safe
  - side_effect_free
  - read_only

denied: false

input_schema_file: schema.json