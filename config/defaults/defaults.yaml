# config/defaults.yaml
app:
  name: "AIProduct"
  environment: "production"

logging:
  level: "INFO"
  console: true
  max_bytes: 5242880
  backup_count: 5

storage:
  mode: "automatic"

database:
  filename: "app.sqlite"
  busy_timeout_ms: 5000
  journal_mode: "WAL"

providers:
  active: null

  priority:
    - gemini
    - deepseek
    - openai
    - grok
    - claude
    - openrouter

  # Per-provider model priority. First = preferred.
  # IMPORTANT: this list must contain ALL models the user might want.
  models:
    gemini:
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-2.5-flash-lite
      - gemini-3.1-pro-preview
      - gemini-3-flash-preview
      - gemini-3.7-flash
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-3.1-flash-lite
      - gemini-flash-latest
      - gemini-pro-latest
    deepseek:
      - deepseek-chat
      - deepseek-reasoner
    openai:
      - gpt-4o-mini
      - gpt-4o
      - gpt-4-turbo
      - gpt-4.1
      - gpt-4.1-mini
      - o1
      - o1-mini
    grok:
      - llama-3.3-70b-versatile
      - llama-3.1-8b-instant
      - mixtral-8x7b-32768
      - qwen-2.5-32b
    claude:
      - claude-3-5-sonnet
    openrouter:
      - openai/gpt-4o-mini
      - anthropic/claude-3.5-sonnet
      - google/gemini-2.5-flash
      - meta-llama/llama-3.3-70b-instruct
      - deepseek/deepseek-chat

  request_timeout_s: 60
  stream: true

agent:
  mode: "auto"
  max_steps: 25
  max_retries: 3
  max_model_calls: 40
  max_execution_time_s: 600
  tool_timeout_s: 60
  cache:
    enabled: true
    ttl_seconds: 3600
    max_entries: 500

voice:
  enabled: false

ui:
  theme: "dark"
  language: "en"

privacy:
  upload_telemetry: false
  send_crash_reports: false

memory:
  enabled: true

permissions:
  auto_allow: {}