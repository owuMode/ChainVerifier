[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiproduct"
version = "1.0.0"
description = "AIProduct — Windows desktop AI assistant (Rhea AI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AIProduct Team" },
]
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0.1",
    "PySide6>=6.7.0",
    "PySide6-WebEngine>=6.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
]

# ----------------------------------------------------------------------
# Packaging
# ----------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",
    "tests.*",
    "scripts",
    "scripts.*",
    "native",
    "native.*",
]

[tool.setuptools.package-data]
"gui.resources" = [
    "*.html",
    "*.css",
    "*.js",
]
"prompts" = [
    "**/*.md",
]
"tools" = [
    "**/manifest.yaml",
    "**/schema.json",
]
"config" = [
    "defaults/*.yaml",
]

# ----------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests that use QtWebEngine (may be flaky on Windows)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]

# ----------------------------------------------------------------------
# Mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
disallow_untyped_defs = false
check_untyped_defs = true

# ----------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "native",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function call in default arg
    "B904",  # raise from in except
    "UP007", # use X | Y for union types (we use this already)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "E", "F401", "F811"]
"gui/resources/*.py" = ["E501"]